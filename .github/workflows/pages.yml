# Push na master = publikacja gry na GitHub Pages, ale tylko po zielonym make check.
name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Dwa deploye naraz się nie przeplatają; trwający nie jest przerywany.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Konfiguracja i zależności (.env z .env.example, npm ci w kontenerze)
        run: make init

      - name: Bramka (lint, format, typy, testy unit/integration/e2e)
        run: make check

      - name: Build do dist/
        run: make build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
