server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # index.html bez cache — każde F5 ładuje aktualny build; assety Vite mają hash w nazwie
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Ta sama gra w podkatalogu, jak na GitHub Pages — test e2e sprawdza względne ścieżki assetów
    location /sokoban/ {
        alias /usr/share/nginx/html/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
