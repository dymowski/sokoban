server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # index.html without cache — every F5 loads the current build; Vite assets have a hash in their names
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The same game in a subdirectory, as on GitHub Pages — the e2e test checks relative asset paths
    location /sokoban/ {
        alias /usr/share/nginx/html/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
